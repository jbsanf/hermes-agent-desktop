name: Verify Flatpak
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.10.0'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree appstream desktop-file-utils python3-packaging python3-gi gir1.2-flatpak-1.0 gnupg zstd dbus-x11 xvfb openssh-client
          flatpak config --user --set languages 'en;pt'
          scripts/setup.sh
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s tests -v
      - run: scripts/build.sh
      - name: Export and install test bundle
        run: |
          KEY=$(scripts/local-key.sh)
          export GNUPGHOME="$PWD/.local-keys"
          python3 scripts/publish-repo.py --key "$KEY"
          dbus-run-session -- scripts/install-local.sh
      - run: dbus-run-session -- python3 scripts/ssh-agent-smoke.py
      - run: dbus-run-session -- python3 scripts/smoke.py
      - run: xvfb-run -a dbus-run-session -- node scripts/gui-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-test-bundle
          path: dist/release/*.flatpak
          retention-days: 7
